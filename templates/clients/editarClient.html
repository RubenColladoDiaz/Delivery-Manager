{% extends "base.html" %}

{% block title %}Editar {{ client.nom_comercial }} - DeliveryHub{% endblock %}

{% block content %}
<div class="pt-20">
    <!-- Header -->
    <div class="max-w-2xl mx-auto px-4 mb-8 animate-slide-down">
        <h1 class="text-5xl font-black gradient-text mb-2">Editar Client</h1>
        <p class="text-gray-400">Actualitza la informació de {{ client.nom_comercial }}</p>
    </div>

    <!-- Form Card -->
    <div class="max-w-2xl mx-auto px-4 mb-20">
        <div class="glass-hover rounded-2xl p-8 animate-fade-scale">
            <form action="{% url 'editarClient' client.id %}" method="post">
                {% csrf_token %}

                <div class="grid grid-cols-2 gap-6">
                    <!-- Codi Client -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-300">Codi Client</label>
                        <input type="text" name="codi_client" value="{{ client.codi_client }}" required>
                    </div>

                    <!-- Nom Comercial -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-300">Nom Comercial</label>
                        <input type="text" name="nom_comercial" value="{{ client.nom_comercial }}" required>
                    </div>

                    <!-- CIF -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-300">CIF</label>
                        <input type="text" name="cif" value="{{ client.cif }}" required>
                    </div>

                    <!-- Persona Contacte -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-300">Persona de Contacte</label>
                        <input type="text" name="persona_contacte" value="{{ client.persona_contacte }}">
                    </div>

                    <!-- Telèfon -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-300">Telèfon</label>
                        <input type="tel" name="telefon" value="{{ client.telefon }}">
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-300">Email</label>
                        <input type="email" name="email" value="{{ client.email }}">
                    </div>

                    <!-- Adreça Entrega (full width) -->
                    <div class="col-span-2">
                        <label class="block text-sm font-semibold mb-2 text-gray-300">Adreça d'Entrega</label>
                        <input type="text" name="adreca_entrega" value="{{ client.adreca_entrega }}" class="w-full">
                    </div>

                    <!-- População -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-300">Ciutat</label>
                        <input type="text" name="poblacio" value="{{ client.poblacio }}">
                    </div>

                    <!-- Codi Postal -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-300">Codi Postal</label>
                        <input type="text" name="codi_postal" value="{{ client.codi_postal }}">
                    </div>

                    <!-- Actiu -->
                    <div class="col-span-2">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" name="actiu" {% if client.actiu %}checked{% endif %} class="w-5 h-5 rounded">
                            <span class="text-white font-semibold">Client Actiu</span>
                        </label>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex gap-4 mt-8 pt-8 border-t border-slate-700/50">
                    <button type="submit" class="flex-1 btn-primary py-3 rounded-xl font-bold text-white transition">
                        <i class="fas fa-save mr-2"></i>Guardar Canvis
                    </button>
                    <a href="{% url 'detallsClient' client.id %}" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white px-4 py-3 rounded-xl transition text-center font-semibold">
                        <i class="fas fa-times mr-2"></i>Cancel·lar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    input[type="text"], input[type="tel"], input[type="email"] {
        width: 100%;
        padding: 12px 16px;
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: white;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    input:focus {
        outline: none;
        background: rgba(30, 41, 59, 0.8);
        border-color: rgba(59, 130, 246, 0.5);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    input::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }

    input[type="checkbox"] {
        appearance: none;
        width: 20px;
        height: 20px;
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    input[type="checkbox"]:checked {
        background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
        border-color: rgba(59, 130, 246, 0.5);
    }
</style>
{% endblock %}
