{% extends "base.html" %}

{% block title %}Reposició de Stock - DeliveryHub{% endblock %}

{% block content %}
<section class="min-h-[60vh] flex items-center justify-center pt-20">
    <div class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-8 animate-slide-down">
            <h1 class="text-4xl font-black gradient-text mb-2">Reposició de Stock</h1>
            <p class="text-gray-400">Afegeix stock als magatzems</p>
        </div>

        <!-- Form Card -->
        <div class="glass-hover rounded-2xl p-8 animate-fade-scale">
            <form action="{% url 'stockReposicio' %}" method="post">
                {% csrf_token %}
                
                <!-- Magatzem Selection -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold mb-2 text-gray-300">Magatzem</label>
                    <select name="magatzemSeleccionat" required class="form-select w-full">
                        <option value="" selected disabled>Selecciona un magatzem...</option>
                        {% for magatzem in magatzems %}
                            <option value="{{ magatzem.id }}">{{ magatzem.nom }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Quantitat -->
                <div class="mb-8">
                    <label class="block text-sm font-semibold mb-2 text-gray-300">Quantitat a Afegir</label>
                    <input type="number" name="quantitat" required min="1" placeholder="0" class="form-input">
                </div>

                <button type="submit" class="btn-primary w-full py-3 rounded-xl font-bold text-lg text-white mb-4 transition">
                    <i class="fas fa-plus-circle mr-2"></i>Afegir Stock
                </button>
            </form>
        </div>

        <!-- Info -->
        <p class="text-center text-gray-400 text-sm mt-6">
            <i class="fas fa-info-circle mr-2 text-blue-400"></i>
            Selecciona el magatzem i la quantitat a afegir
        </p>
    </div>
</section>

<style>
    input[type="number"], select {
        width: 100%;
        padding: 12px 16px;
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: white;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    input[type="number"]:focus, select:focus {
        outline: none;
        background: rgba(30, 41, 59, 0.8);
        border-color: rgba(59, 130, 246, 0.5);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    input[type="number"]::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }

    select option {
        background-color: #1e293b;
        color: white;
    }
</style>
{% endblock %}
