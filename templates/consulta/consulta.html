{% extends "base.html" %}

{% block title %}Consulta Albarà - DeliveryHub{% endblock %}

{% block content %}
<section class="min-h-[60vh] flex items-center justify-center pt-20">
    <div class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-8 animate-slide-down">
            <h1 class="text-4xl font-black gradient-text mb-2">Consulta Albarà</h1>
            <p class="text-gray-400">Busca informació del teu albarà</p>
        </div>

        <!-- Form Card -->
        <div class="glass-hover rounded-2xl p-8 animate-fade-scale">
            <form action="{% url 'consulta' %}" method="post">
                {% csrf_token %}
                
                <div class="mb-8">
                    <label class="block text-sm font-semibold mb-2 text-gray-300">Número Albarà</label>
                    <input type="text" name="numero_albara" placeholder="P.ex. ALB-001-2026" required>
                </div>

                <button type="submit" class="btn-primary w-full py-3 rounded-xl font-bold text-lg text-white mb-4 transition">
                    <i class="fas fa-search mr-2"></i>Consultar
                </button>
            </form>
        </div>

        <!-- Help Text -->
        <p class="text-center text-gray-400 text-sm mt-6">
            <i class="fas fa-info-circle mr-2 text-blue-400"></i>
            Introdueix el número del teu albarà per veure els detalls
        </p>
    </div>
</section>

<style>
    input[type="text"] {
        width: 100%;
        padding: 12px 16px;
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: white;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    input[type="text"]:focus {
        outline: none;
        background: rgba(30, 41, 59, 0.8);
        border-color: rgba(59, 130, 246, 0.5);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    input[type="text"]::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }
</style>
{% endblock %}
